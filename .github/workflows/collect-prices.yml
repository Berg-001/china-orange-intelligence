name: Collect China and CEPEA orange prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests==2.32.4 beautifulsoup4==4.13.4
      - name: Collect and normalize verified observations
        run: python scripts/collect_static.py
      - name: Commit new observations
        run: |
          if git diff --quiet -- frontend/public/data; then
            echo "No new observations"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          git commit -m "data: update China orange prices"
          git push
