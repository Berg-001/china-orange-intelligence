services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omip
      POSTGRES_USER: omip
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-omip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omip -d omip"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/omip
      DATABASE_USER: omip
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-omip}
      COLLECTION_CRON: ${COLLECTION_CRON:-0 0 7 * * *}
      DEMO_COLLECTOR_ENABLED: ${DEMO_COLLECTOR_ENABLED:-true}
      NANTONG_COLLECTOR_ENABLED: ${NANTONG_COLLECTOR_ENABLED:-false}
      NANTONG_BULLETIN_URLS: ${NANTONG_BULLETIN_URLS:-}
      YUNFU_COLLECTOR_ENABLED: ${YUNFU_COLLECTOR_ENABLED:-false}
      YUNFU_BULLETIN_URLS: ${YUNFU_BULLETIN_URLS:-}
      XINHUA_COLLECTOR_ENABLED: ${XINHUA_COLLECTOR_ENABLED:-false}
      XINHUA_ORANGE_JUICE_URLS: ${XINHUA_ORANGE_JUICE_URLS:-}
      ADMIN_ENDPOINT_ENABLED: ${ADMIN_ENDPOINT_ENABLED:-true}
      USD_PER_BRL: ${USD_PER_BRL:-0.18}
      USD_PER_CNY: ${USD_PER_CNY:-0.139}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  postgres_data:
